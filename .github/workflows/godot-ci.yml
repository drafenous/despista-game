name: Godot CI

on:
  push:
    branches:
      - migration/godot
    paths:
      - "godot/**"
      - ".github/workflows/godot-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "godot/**"
      - ".github/workflows/godot-ci.yml"
  workflow_dispatch:

jobs:
  test:
    name: Parse and test Godot project
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        shell: bash
        run: |
          curl --fail --location --retry 3             "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"             --output /tmp/godot.zip
          echo "2d7c78f539b8f51fce0fbaeddd6428d1dbe9b07264b7cb857384289448b7c3e4  /tmp/godot.zip" > /tmp/godot.sha256 || true
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          echo "/tmp/godot" >> "$GITHUB_PATH"

      - name: Import and parse project
        shell: bash
        run: |
          Godot_v4.7.2-stable_linux.x86_64             --headless             --path godot             --editor             --quit-after 5

      - name: Run gameplay tests
        shell: bash
        run: |
          Godot_v4.7.2-stable_linux.x86_64             --headless             --path godot             --script res://tests/test_game_engine.gd
